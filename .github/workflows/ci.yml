name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  invariant-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install base dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/base.txt

      - name: Run invariant test suite
        run: python -m pytest tests/invariants/ -v

      - name: Fail loudly if invariant tests are missing
        # A green CI run with zero collected tests is worse than a red
        # one — it looks like safety without providing any. This turns
        # "0 tests silently passed" into an explicit failure.
        run: |
          COUNT=$(python -m pytest tests/invariants/ --collect-only -q | tail -1)
          echo "$COUNT"
          if echo "$COUNT" | grep -q "no tests ran"; then
            echo "::error::No invariant tests were collected — CI is not actually checking anything"
            exit 1
          fi